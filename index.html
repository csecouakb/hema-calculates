<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8f0ec">
  <meta name="description" content="AKB Calculates">

  <link rel="manifest" href="./manifest.webmanifest">

  <title>AKB Calculates</title>

  <style>
    :root {
      --bg: #eef3ef;
      --card: #ffffff;
      --text: #26332d;
      --muted: #66736c;
      --border: #d5ded8;
      --primary: #496b5a;
      --primary-soft: #e4eee8;
      --danger: #a65b5b;
      --input: #f7faf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Bengali",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app { width: min(100%, 760px); margin: auto; padding: 8px; }
    body { min-height: 100dvh; overflow-x: hidden; }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 800;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      min-height: 54px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .note-item {
      min-width: 0;
    }

    .denom {
      text-align: center;
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .note-input {
      width: 100%;
      height: 54px;
      border: 2px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      outline: none;
    }

    .note-input:focus,
    .misc-input:focus,
    .party-input:focus,
    .misc-calc-display:focus {
      border-color: var(--primary);
    }

    .note-subtotal {
      margin-top: 4px;
      min-height: 24px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
    }

    .party-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .party-label {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .party-input {
      width: 100%;
      height: 44px;
      border: 2px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 13px;
      padding: 6px 10px;
      font-size: 18px;
      font-weight: 700;
      outline: none;
    }

    .misc-field-wrap {
      position: relative;
    }

    .misc-calc {
      display: none;
      position: fixed;
      z-index: 50;
      left: 8px;
      right: 8px;
      bottom: 8px;
      top: auto;
      max-width: 520px;
      margin: auto;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(38, 51, 45, 0.14);
    }

    .misc-calc.open {
      display: block;
    }

    .misc-calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .misc-calc-btn {
      min-height: 46px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 11px;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
    }

    .misc-calc-btn.operator {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .misc-calc-btn.confirm {
      background: var(--primary);
      color: white;
      grid-column: 4;
      grid-row: 5;
    }

    .misc-calc-btn.clear {
      background: #f3e4e4;
      color: var(--danger);
    }

    .misc-result {
      margin-top: 5px;
      font-size: 14px;
      color: var(--muted);
      text-align: right;
      min-height: 20px;
    }

    .misc-label {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .misc-input {
      width: 100%;
      height: 46px;
      border: 2px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 13px;
      padding: 8px 12px;
      font-size: 22px;
      font-weight: 700;
      outline: none;
    }

    .total-box {
      background: var(--primary-soft);
      border: 2px solid #c7d8ce;
      border-radius: 18px;
      padding: 7px;
      text-align: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .total-box.total-ok {
      background: #e4eee8;
      border-color: #b9d0c2;
    }

    .total-box.total-high {
      background: #f3e4e4;
      border-color: #e3caca;
    }

    .total-box.total-low {
      background: #fff3d9;
      border-color: #ead9a8;
    }

    .total-label {
      font-size: 16px;
      font-weight: 800;
    }

    .total {
      margin-top: 2px;
      font-size: clamp(38px, 10vw, 64px);
      line-height: 1.1;
      font-weight: 900;
      word-break: break-word;
    }

    .target-status {
      min-height: 0;
      margin-top: 4px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
    }

    .target-status:empty {
      display: none;
    }

    .target-status.target-ok {
      color: #496b5a;
    }

    .target-status.target-high {
      color: #a65b5b;
    }

    .target-status.target-low {
      color: #8a681d;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    .btn {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-soft {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: #f3e4e4;
      color: var(--danger);
      border: 1px solid #e3caca;
    }


    .target-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
    }
    .target-label { font-size: 16px; font-weight: 800; white-space: nowrap; }
    .target-input {
      width: 100%; height: 42px; border: 2px solid var(--border);
      background: var(--input); color: var(--text); border-radius: 11px;
      padding: 5px 10px; font-size: 19px; font-weight: 800; outline: none;
    }
    .target-status {
      min-height: 30px; padding: 5px 8px; border-radius: 9px;
      text-align: center; font-size: 14px; font-weight: 900; margin-bottom: 6px;
    }
    .target-status:empty { display:none; }
    .target-ok { color:#496b5a; }
    .target-high { color:#a65b5b; }
    .target-low { color:#8a681d; }

    /* Calculator */

    .calc-display {
      width: 100%;
      min-height: 90px;
      background: var(--input);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      text-align: right;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 800;
      overflow-x: auto;
      margin-bottom: 10px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .calc-btn {
      min-height: 62px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 14px;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }

    .calc-btn.operator {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .calc-btn.equal {
      background: var(--primary);
      color: white;
    }

    .calc-mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 8px;
    }
    .calc-mode-btn {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }
    .calc-mode-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
    }
    .advanced-section {
      margin-top: 7px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--input);
    }
    .advanced-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .fraction-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      gap: 6px;
      align-items: center;
    }
    .advanced-input {
      width: 100%;
      height: 42px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      padding: 5px 8px;
      font-size: 17px;
      font-weight: 700;
      outline: none;
    }
    .advanced-action {
      min-height: 42px;
      padding: 0 10px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 15px;
    }
    .advanced-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 7px;
    }
    .advanced-grid.two { grid-template-columns: 1fr 1fr; }
    .advanced-fn {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--card);
      font-size: 18px;
      font-weight: 800;
    }
    .advanced-result {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      overflow-wrap: anywhere;
    }

    /* History */

    .history-empty {
      text-align: center;
      color: var(--muted);
      font-size: 19px;
      padding: 25px 10px;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--input);
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .history-total {
      font-size: 25px;
      font-weight: 900;
    }

    .history-time {
      color: var(--muted);
      font-size: 15px;
    }

    .history-breakdown {
      font-size: 16px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .app { padding: 6px; }
      header { margin-bottom: 6px; }
      header h1 { font-size: 27px; }
      .tabs { gap: 5px; margin-bottom: 6px; }
      .tab { min-height: 43px; font-size: 14px; border-radius: 11px; }
      .card { padding: 7px; border-radius: 14px; }
      .note-grid { gap: 5px; }
      .denom { font-size: 16px; margin-bottom: 2px; }
      .note-input { height: 42px; font-size: 18px; border-radius: 9px; }
      .note-subtotal { min-height: 17px; margin-top: 2px; font-size: 12px; }
      .party-row { gap: 5px; margin-bottom: 5px; }
      .target-row { grid-template-columns: auto 1fr; gap: 5px; margin-bottom: 5px; }
      .target-label { font-size: 14px; }
      .target-input { height: 39px; font-size: 17px; }
      .target-status { min-height: 27px; font-size: 13px; padding: 4px; }
      .party-label { font-size: 14px; }
      .party-input { height: 40px; font-size: 16px; }
      .misc-label { font-size: 15px; }
      .misc-input { height: 42px; font-size: 20px; }
      .total-box { margin-top: 6px !important; padding: 5px; }
      .total-label { font-size: 15px; }
      .total { font-size: 40px; }
      .actions { gap: 6px; margin-top: 6px; }
      .btn { min-height: 44px; font-size: 15px; border-radius: 11px; }
      .calc-display { min-height: 70px; font-size: 34px; margin-bottom: 7px; }
      .calc-grid { gap: 5px; }
      .calc-btn { min-height: 48px; font-size: 21px; border-radius: 10px; }
      .calc-mode-btn { min-height: 38px; font-size: 15px; }
      .advanced-section { padding: 6px; }
      .advanced-input { height: 39px; font-size: 16px; }
      .advanced-action { min-height: 39px; font-size: 14px; }
      .advanced-fn { min-height: 41px; font-size: 17px; }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>AKB Calculates</h1>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="notes">নোট কাউন্টার</button>
    <button class="tab" data-tab="calculator">ক্যালকুলেটর</button>
    <button class="tab" data-tab="history">হিস্টোরি</button>
  </div>

  <!-- NOTE COUNTER -->
  <section id="notes" class="panel active">

    <div class="card">

      <div class="target-row">
        <div class="target-label">Target</div>
        <input id="targetInput" class="target-input" inputmode="decimal" placeholder="Target Amount" aria-label="Target Amount">
      </div>
      <div class="party-row">
        <div class="party-label">Note (Optional)</div>
        <input id="partyInput" class="party-input" type="text" placeholder="" aria-label="Note">
      </div>

<div id="totalBox" class="total-box" style="margin-top:12px;">
        <div class="total-label">সর্বমোট</div>
        <div id="total" class="total">৳0</div>
        <div id="targetStatus" class="target-status"></div>
      </div>

      <div class="note-grid">

        <div class="note-item">
          <div class="denom">৳1000</div>
          <input class="note-input" data-denom="1000"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="1000 টাকার নোট সংখ্যা"
                 oninput="window.calculateTotal()">
          <div class="note-subtotal" id="subtotal-1000"></div>
        </div>

        <div class="note-item">
          <div class="denom">৳500</div>
          <input class="note-input" data-denom="500"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="500 টাকার নোট সংখ্যা">
          <div class="note-subtotal" id="subtotal-500"></div>
        </div>

        <div class="note-item">
          <div class="denom">৳200</div>
          <input class="note-input" data-denom="200"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="200 টাকার নোট সংখ্যা">
          <div class="note-subtotal" id="subtotal-200"></div>
        </div>

        <div class="note-item">
          <div class="denom">৳100</div>
          <input class="note-input" data-denom="100"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="100 টাকার নোট সংখ্যা">
          <div class="note-subtotal" id="subtotal-100"></div>
        </div>

        <div class="note-item">
          <div class="denom">৳50</div>
          <input class="note-input" data-denom="50"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="50 টাকার নোট সংখ্যা">
          <div class="note-subtotal" id="subtotal-50"></div>
        </div>

        <div class="note-item">
          <div class="denom">৳20</div>
          <input class="note-input" data-denom="20"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="20 টাকার নোট সংখ্যা">
          <div class="note-subtotal" id="subtotal-20"></div>
        </div>

        <div class="note-item">
          <div class="denom">৳10</div>
          <input class="note-input" data-denom="10"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="10 টাকার নোট সংখ্যা">
          <div class="note-subtotal" id="subtotal-10"></div>
        </div>

        <div class="note-item">
          <div class="denom">৳5</div>
          <input class="note-input" data-denom="5"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="5 টাকার নোট সংখ্যা">
          <div class="note-subtotal" id="subtotal-5"></div>
        </div>

      </div>

      <div style="margin-top:12px;">
        <div class="misc-label">বিবিধ</div>

        <div class="misc-field-wrap">
          <input id="miscInput"
                 class="misc-input"
                 inputmode="none"
                 readonly
                 placeholder="টাকার পরিমাণ"
                 aria-label="বিবিধ টাকার পরিমাণ">

          <div id="miscCalc" class="misc-calc" aria-label="বিবিধ mini calculator">
            <div class="misc-calc-buttons">

              <button type="button" class="misc-calc-btn" data-misc-value="7">7</button>
              <button type="button" class="misc-calc-btn" data-misc-value="8">8</button>
              <button type="button" class="misc-calc-btn" data-misc-value="9">9</button>
              <button type="button" class="misc-calc-btn operator" data-misc-value="+">+</button>

              <button type="button" class="misc-calc-btn" data-misc-value="4">4</button>
              <button type="button" class="misc-calc-btn" data-misc-value="5">5</button>
              <button type="button" class="misc-calc-btn" data-misc-value="6">6</button>
              <button type="button" class="misc-calc-btn operator" data-misc-value="-">−</button>

              <button type="button" class="misc-calc-btn" data-misc-value="1">1</button>
              <button type="button" class="misc-calc-btn" data-misc-value="2">2</button>
              <button type="button" class="misc-calc-btn" data-misc-value="3">3</button>
              <button type="button" class="misc-calc-btn operator" data-misc-value="*">×</button>

              <button type="button" class="misc-calc-btn" data-misc-value="0">0</button>
              <button type="button" class="misc-calc-btn" data-misc-value=".">.</button>
              <button type="button" class="misc-calc-btn operator" data-misc-action="backspace">⌫</button>
              <button type="button" class="misc-calc-btn operator" data-misc-value="/">÷</button>

              <button type="button" class="misc-calc-btn clear" data-misc-action="clear">C</button>
              <button type="button" class="misc-calc-btn operator" data-misc-action="equals">=</button>
              <button type="button" class="misc-calc-btn" style="visibility:hidden;"> </button>
              <button type="button" class="misc-calc-btn confirm" data-misc-action="confirm">✓</button>

            </div>

            <div id="miscResult" class="misc-result">অঙ্ক লিখে ✓ চাপুন</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="newBtn" class="btn btn-soft">নতুন হিসাব</button>
        <button id="saveBtn" class="btn btn-primary">হিসাব সংরক্ষণ</button>
      </div>

    </div>

  </section>

  <!-- CALCULATOR -->
  <section id="calculator" class="panel">
    <div class="card">
      <div class="calc-mode">
        <button id="normalModeBtn" class="calc-mode-btn active">Normal</button>
        <button id="advancedModeBtn" class="calc-mode-btn">Advanced</button>
      </div>

      <div id="calcDisplay" class="calc-display">0</div>

      <div id="normalCalc">
        <div class="calc-grid">
          <button class="calc-btn operator" data-action="clear">C</button>
          <button class="calc-btn operator" data-action="backspace">⌫</button>
          <button class="calc-btn operator" data-value="%">%</button>
          <button class="calc-btn operator" data-value="/">÷</button>
          <button class="calc-btn" data-value="7">7</button>
          <button class="calc-btn" data-value="8">8</button>
          <button class="calc-btn" data-value="9">9</button>
          <button class="calc-btn operator" data-value="*">×</button>
          <button class="calc-btn" data-value="4">4</button>
          <button class="calc-btn" data-value="5">5</button>
          <button class="calc-btn" data-value="6">6</button>
          <button class="calc-btn operator" data-value="-">−</button>
          <button class="calc-btn" data-value="1">1</button>
          <button class="calc-btn" data-value="2">2</button>
          <button class="calc-btn" data-value="3">3</button>
          <button class="calc-btn operator" data-value="+">+</button>
          <button class="calc-btn" data-value="0">0</button>
          <button class="calc-btn" data-value=".">.</button>
          <button class="calc-btn operator" data-value="(">(</button>
          <button class="calc-btn operator" data-value=")">)</button>
          <button class="calc-btn equal" data-action="equals" style="grid-column:1 / -1;">=</button>
        </div>
      </div>

      <div id="advancedCalc" style="display:none;">
        <div class="advanced-section">
          <div class="advanced-title">ভগ্নাংশের মান</div>
          <div class="fraction-row">
            <input id="fracNumerator" class="advanced-input" inputmode="decimal" placeholder="লব">
            <span>/</span>
            <input id="fracDenominator" class="advanced-input" inputmode="decimal" placeholder="হর">

          <div id="fractionResult" class="advanced-result">লব ÷ হর = দশমিক মান</div>
        </div>

        <div class="advanced-section">
          <div class="advanced-title">Power</div>
          <div class="fraction-row">
            <input id="powerBase" class="advanced-input" inputmode="decimal" placeholder="Base">
            <span>^</span>
            <input id="powerExponent" class="advanced-input" inputmode="decimal" placeholder="Power">
            <button id="powerBtn" class="advanced-action">xʸ</button>
          </div>
          <div id="powerResult" class="advanced-result">Base-এর Power</div>
        </div>

        <div class="advanced-grid">
          <button class="advanced-fn" data-adv="sqrt">√x</button>
          <button class="advanced-fn" data-adv="log">log</button>
          <button class="advanced-fn" data-adv="ln">ln</button>
          <button class="advanced-fn" data-adv="factorial">n!</button>

        <div class="advanced-section">
          <div class="advanced-title">nPr / nCr</div>
          <div class="fraction-row">
            <input id="combN" class="advanced-input" inputmode="numeric" placeholder="n">
            <span>,</span>
            <input id="combR" class="advanced-input" inputmode="numeric" placeholder="r">
          </div>
          <div class="advanced-grid two">
            <button id="nprBtn" class="advanced-fn">nPr</button>
            <button id="ncrBtn" class="advanced-fn">nCr</button>
          </div>
          <div id="combResult" class="advanced-result">n এবং r দিন</div>

  <!-- HISTORY -->
  <section id="history" class="panel">

    <div class="card">

      <div id="historyList"></div>

      <button id="clearHistoryBtn"
              class="btn btn-danger"
              style="width:100%;">
        সব হিসাব মুছুন
      </button>

    </div>

  </section>

</div>

<script>

  /* =========================
     TAB SYSTEM
  ========================= */

  document.querySelectorAll(".tab").forEach(tab => {

    tab.addEventListener("click", () => {

      document.querySelectorAll(".tab")
        .forEach(t => t.classList.remove("active"));

      document.querySelectorAll(".panel")
        .forEach(p => p.classList.remove("active"));

      tab.classList.add("active");

      document
        .getElementById(tab.dataset.tab)
        .classList.add("active");

      if (tab.dataset.tab === "history") {
        renderHistory();
      }

    });

  });


  /* =========================
     NOTE COUNTER
  ========================= */

  const noteInputs =
    document.querySelectorAll(".note-input");

  const partyInput =
    document.getElementById("partyInput");

  const miscInput =
    document.getElementById("miscInput");

  const miscCalc =
    document.getElementById("miscCalc");

  const miscResult =
    document.getElementById("miscResult");

  const totalElement =
    document.getElementById("total");

  const targetInput =
    document.getElementById("targetInput");

  const targetStatus =
    document.getElementById("targetStatus");

  const totalBox =
    document.getElementById("totalBox");

  let miscExpression = "";
  let miscValue = 0;

  function formatMoney(amount) {
    return "৳" + Number(amount || 0).toLocaleString("en-IN");
  }

  function formatNumberBD(amount) {
    return Number(amount || 0).toLocaleString("en-IN");
  }

  function updateNoteSubtotals() {
    noteInputs.forEach(input => {
      const denomination = Number(input.dataset.denom);
      const count = Number(input.value) || 0;
      const subtotal = document.getElementById("subtotal-" + denomination);

      subtotal.textContent = count > 0
        ? formatMoney(denomination * count)
        : "";
    });
  }

  function updateTargetStatus(total) {
    totalBox.classList.remove("total-ok", "total-high", "total-low");

    if (targetInput.value.trim() === "") {
      targetStatus.textContent = "";
      targetStatus.className = "target-status";
      return;
    }

    const target = Number(targetInput.value.replace(/,/g, ""));

    if (!Number.isFinite(target) || target < 0) {
      targetStatus.textContent = "⚠ সঠিক Target Amount দিন";
      targetStatus.className = "target-status target-low";
      totalBox.classList.add("total-low");
      return;
    }

    const difference = total - target;

    if (difference === 0) {
      targetStatus.textContent = "✓ Target Amount-এর সাথে মিলেছে: ৳" + formatNumberBD(total);
      targetStatus.className = "target-status target-ok";
      totalBox.classList.add("total-ok");
    } else if (difference > 0) {
      targetStatus.textContent = "↑ Target-এর চেয়ে বেশি: ৳" + formatNumberBD(difference);
      targetStatus.className = "target-status target-high";
      totalBox.classList.add("total-high");
    } else {
      targetStatus.textContent = "⚠ Target-এর চেয়ে কম: ৳" + formatNumberBD(Math.abs(difference));
      targetStatus.className = "target-status target-low";
      totalBox.classList.add("total-low");
    }
  }

  function calculateTotal() {
    let total = 0;

    noteInputs.forEach(input => {
      total += Number(input.dataset.denom) * (Number(input.value) || 0);
    });

    total += Number(miscValue) || 0;
    updateNoteSubtotals();
    totalElement.textContent = formatMoney(total);
    updateTargetStatus(total);
    return total;
  }

  window.calculateTotal = calculateTotal;

  noteInputs.forEach(input => {
    input.oninput = calculateTotal;
    input.onchange = calculateTotal;
    input.onkeyup = calculateTotal;
    input.addEventListener("input", calculateTotal);
    input.addEventListener("change", calculateTotal);
    input.addEventListener("keyup", calculateTotal);
  });

  targetInput.addEventListener("input", calculateTotal);
  targetInput.addEventListener("change", calculateTotal);

  calculateTotal();

  function updateMiscDisplay() {
    miscInput.value = miscExpression;
  }

  function evaluateMiscExpression() {
    if (!miscExpression) return null;

    try {
      const expression = miscExpression.replace(/×/g, "*").replace(/÷/g, "/");

      if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
        throw new Error();
      }

      const result = Function(
        '"use strict"; return (' + expression + ')'
      )();

      if (!Number.isFinite(result)) {
        throw new Error();
      }

      return result;
    } catch {
      return null;
    }
  }

  function openMiscCalc() {
    miscCalc.classList.add("open");
  }

  function closeMiscCalc() {
    miscCalc.classList.remove("open");
  }

  miscInput.addEventListener("click", openMiscCalc);
  miscInput.addEventListener("focus", openMiscCalc);

  document.addEventListener("click", event => {
    if (!event.target.closest(".misc-field-wrap")) {
      closeMiscCalc();
    }
  });

  function confirmMisc() {
    const result = evaluateMiscExpression();

    if (result === null) {
      miscResult.textContent = "হিসাবটি সঠিক নয়";
      return;
    }

    miscValue = result;
    miscExpression = String(result);
    updateMiscDisplay();
    miscResult.textContent = "✓ " + formatMoney(result);
    calculateTotal();
    closeMiscCalc();
    miscInput.blur();
  }

  document.querySelectorAll(".misc-calc-btn").forEach(button => {
    button.addEventListener("click", event => {
      event.preventDefault();

      const value = button.dataset.miscValue;
      const action = button.dataset.miscAction;

      if (action === "clear") {
        miscExpression = "";
        miscValue = 0;
        updateMiscDisplay();
        miscResult.textContent = "অঙ্ক লিখে ✓ চাপুন";
        calculateTotal();
        return;
      }

      if (action === "backspace") {
        miscExpression = miscExpression.slice(0, -1);
        updateMiscDisplay();

        const result = evaluateMiscExpression();
        miscValue = result === null ? 0 : result;
        calculateTotal();
        return;
      }

      if (action === "equals") {
        const result = evaluateMiscExpression();

        if (result === null) {
          miscResult.textContent = "হিসাবটি সঠিক নয়";
          return;
        }

        miscExpression = String(result);
        miscValue = result;
        updateMiscDisplay();
        miscResult.textContent = "ফলাফল: " + formatMoney(result);
        calculateTotal();
        return;
      }

      if (action === "confirm") {
        confirmMisc();
        return;
      }

      if (value !== undefined) {
        const last = miscExpression.slice(-1);
        const operators = ["+", "-", "*", "/"];
        const isOperator = operators.includes(value);

        if (isOperator && operators.includes(last)) {
          miscExpression = miscExpression.slice(0, -1) + value;
        } else if (value === "." && last === ".") {
          return;
        } else {
          miscExpression += value;
        }

        updateMiscDisplay();

        const result = evaluateMiscExpression();
        if (result !== null) {
          miscValue = result;
          calculateTotal();
        }
      }
    });
  });


  /* =========================
     NEW CALCULATION
  ========================= */

  document.getElementById("newBtn")
    .addEventListener("click", () => {

      noteInputs.forEach(input => {
        input.value = "";
      });

      partyInput.value = "";
      targetInput.value = "";
      targetStatus.textContent = "";
      targetStatus.className = "target-status";
      miscExpression = "";
      miscValue = 0;
      miscInput.value = "";
      miscResult.textContent = "অঙ্ক লিখে ✓ চাপুন";
      closeMiscCalc();

      calculateTotal();

    });


  /* =========================
     HISTORY
  ========================= */

  function getHistory() {

    try {
      return JSON.parse(
        localStorage.getItem("akbCalculatesHistory")
      ) || [];
    } catch {
      return [];
    }

  }


  function saveHistory(history) {

    localStorage.setItem(
      "akbCalculatesHistory",
      JSON.stringify(history)
    );

  }


  document.getElementById("saveBtn")
    .addEventListener("click", () => {

      const total = calculateTotal();

      const breakdown = {};

      noteInputs.forEach(input => {

        const denomination =
          input.dataset.denom;

        const count =
          Number(input.value) || 0;

        if (count > 0) {
          breakdown[denomination] = count;
        }

      });

      const misc = Number(miscValue) || 0;

      const now = new Date();
